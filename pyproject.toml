[project]
name = "hermes-yandex-messenger"
version = "0.1.1"
description = "Native Yandex Messenger platform plugin for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".uv-cache", ".venv"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
